<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sawaari Radio — Mobile Now Playing (reference)</title>
<style>
  body { margin:0; background:#12100e; }
  a { color:#e8c46a; text-decoration:none; }
  a:hover { color:#ffffff; }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div style="width:390px; height:844px; position:relative; overflow:hidden; font-family:'Anek Devanagari',system-ui,sans-serif; background:#2b241f;">
  <div style="position:absolute; inset:0; background-image:url('Frame 1.png'); background-repeat:no-repeat; background-size:1794px 887px; background-position:100% 37%;"></div>
  <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,14,10,.7) 0%, rgba(20,14,10,.6) 30%, rgba(20,14,10,.22) 48%, rgba(16,10,7,.72) 78%, rgba(14,9,6,.88) 100%);"></div>

  <div style="position:absolute; top:14px; left:24px; right:24px; display:flex; align-items:center; justify-content:space-between; font-family:'DM Mono',monospace; font-size:13px; color:#fff;">
    <span>1:26</span>
    <span style="display:flex; gap:6px; align-items:center; opacity:.9;">
      <span style="width:16px; height:9px; border:1px solid rgba(255,255,255,.7); border-radius:2px; display:block;"><span style="display:block; width:70%; height:100%; background:#fff;"></span></span>
    </span>
  </div>

  <div style="position:absolute; top:196px; left:24px;">
    <div style="font-weight:800; font-size:46px; line-height:.92; color:#fff; letter-spacing:-0.02em; text-shadow:0 4px 26px rgba(0,0,0,.5);">सवारी<br>रेडियो</div>
    <div style="margin-top:12px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.75);">non-stop highway radio</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; padding: 22px 20px 24px; box-sizing: border-box; border-radius: 26px; backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2); background-color: rgba(20,15,11,.55)">
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:64px; height:64px; flex:none; border-radius:14px; background:linear-gradient(140deg,#c8452f,#e8a34a); box-shadow:0 6px 18px rgba(0,0,0,.35);"></div>
      <div style="flex:1; min-width:0;">
        <div style="font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.22em; color:rgba(255,255,255,.6);">NOW PLAYING</div>
        <div style="margin-top:4px; font-size:21px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">गाड़ी बुला रही है</div>
        <div style="font-size:14px; color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">किशोर कुमार · Dost 1974</div>
      </div>
    </div>

    <div style="margin-top:20px; display:flex; align-items:center; height:20px;">
      <div style="flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.24); position:relative;">
        <div style="width:26%; height:100%; border-radius:2px; background:#fff;"></div>
        <div style="position:absolute; left:26%; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45);"></div>
      </div>
    </div>
    <div style="margin-top:6px; display:flex; justify-content:space-between; font-family:'DM Mono',monospace; font-size:11px; color:rgba(255,255,255,.55);">
      <span>1:02</span><span>-2:56</span>
    </div>

    <div style="margin-top:18px; display:flex; align-items:center; justify-content:center; gap:26px;">
      <div style="width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.9); font-size:19px; background:rgba(255,255,255,.08);">⏮</div>
      <div style="width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#f3ece1; color:#1a1613; font-size:24px; box-shadow:0 8px 24px rgba(0,0,0,.4);">▶</div>
      <div style="width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.9); font-size:19px; background:rgba(255,255,255,.08);">⏭</div>
    </div>
  </div>

  <div style="position:absolute; left:50%; bottom:9px; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:rgba(255,255,255,.55);"></div>
</div>
</body>
</html>
