<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Sawaari Radio — Windshield (Glass Shelf v2)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#12100e; }
  a { color:#e8c46a; text-decoration:none; }
  a:hover { color:#ffffff; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
</style>
</head>
<body style="margin:0; background:#12100e;">
<div style="width:1280px; height:720px; position:relative; overflow:hidden; font-family:'Anek Devanagari',system-ui,sans-serif; background:#2b241f url('Frame 1.png') center/cover no-repeat;">
  <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,14,10,.52) 0%, rgba(20,14,10,.06) 38%, rgba(20,14,10,.5) 100%);"></div>
  <div style="position:absolute; top:22px; left:48px; right:48px; display:flex; align-items:center; justify-content:space-between; font-family:'DM Mono',monospace; font-size:13px; color:rgba(255,255,255,.9);">
    <span>1:26 am</span>
    <span style="position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px;"><span style="width:7px; height:7px; border-radius:50%; background:#5fd07a; animation:pulse 2.4s ease-in-out infinite;"></span>42 sawaari on board</span>
    <span style="display:flex; gap:22px;"><span>Spotify ↗</span><span>YT Music ↗</span></span>
  </div>
  <div style="position:absolute; top:76px; left:48px;">
    <div style="font-weight:800; font-size:96px; line-height:.9; color:#fff; letter-spacing:-0.03em;">सवारी<br>रेडियो</div>
    <div style="margin-top:18px; font-family:'DM Mono',monospace; font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:rgba(255,255,255,.78);">non-stop highway radio</div>
  </div>

  <div style="position: absolute; left: 48px; bottom: 48px; height: 109px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap:36px; border-radius: 18px; background: rgba(20,15,11,.62); backdrop-filter: blur(26px); border: 1px solid rgba(255,255,255,.24); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22); opacity: 0.66; width: fit-content;">
    <div style="display:flex; align-items:center; gap:22px; flex:none;">
      <div style="width:78px; height:78px; flex:none; border-radius:12px; background:linear-gradient(140deg,#c8452f,#e8a34a); box-shadow:0 6px 18px rgba(0,0,0,.35);"></div>
      <div style="width: 153px; flex: none; min-width: 0; height: 67px">
        <div style="font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.24em; color:rgba(255,255,255,.62);">NOW PLAYING</div>
        <div style="margin-top: 5px; font-size: 20px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 156px; height: 31px">गाड़ी बुला रही है</div>
        <div style="font-size:13px; color:rgba(255,255,255,.6);">किशोर कुमार · 1974</div>
      </div>
    </div>

    <div style="width:300px; flex:none; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <div style="display:flex; align-items:center; gap:20px; color:rgba(255,255,255,.88); font-size:15px;">
        <span>⏮</span>
        <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.92); color: #1a1613; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.3)">▶</span><span>⏭</span>
      </div>
      <div style="width:100%; display:flex; align-items:center; gap:12px; font-family:'DM Mono',monospace; font-size:10px; color:rgba(255,255,255,.6);">
        <span>1:02</span>
        <span style="flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.26);"><span style="display:block; width:26%; height:100%; border-radius:2px; background:#fff;"></span></span>
        <span>3:58</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
