<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>सवारी रेडियो — Sawaari Radio</title>
<meta name="description" content="Non-stop highway radio from the front seat of an Indian public bus.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Desktop and mobile now share the same background photo (Glass Control
     Card handoff, both breakpoints) — only the CSS crop/position differs. -->
<img class="hero" src="assets/hero.webp" alt="View of a bus dashboard and shrine looking out onto a busy Indian street.">

<div class="scrim" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="status-bar">
  <span id="clock">--:--</span>

  <nav class="top-links">
    <!-- The curated playlist in each app. `si=` share tokens intentionally
         stripped — they're per-share attribution, not needed to open these. -->
    <a href="https://open.spotify.com/playlist/7woOLSZijkm50yU3QelG8X" target="_blank" rel="noopener">Spotify ↗</a>
    <a href="https://music.youtube.com/playlist?list=PLDdNNsCxZ2Js" target="_blank" rel="noopener">YT Music ↗</a>
    <button type="button" class="suggest-toggle" id="suggest-toggle" aria-expanded="false" aria-controls="suggest-panel">Suggest a song</button>
  </nav>
</header>

<div class="suggest-panel" id="suggest-panel" hidden>
  <div class="eyebrow">Suggest a song</div>
  <form id="recommend-form" novalidate>
    <input type="text" id="rec-song" name="song" maxlength="120" required autocomplete="off" placeholder="Song name">
    <input type="text" id="rec-artist" name="artist" maxlength="200" autocomplete="off" placeholder="Artist or link (optional)">

    <!-- honeypot: off-screen rather than display:none so naive bots still fill it -->
    <div class="hp" aria-hidden="true">
      <label for="rec-website">Website</label>
      <input type="text" id="rec-website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="rec-submit">Send</button>
    <p class="rec-status" id="rec-status" role="status"></p>
  </form>
</div>

<div class="masthead" lang="hi">
  <div class="masthead-title">सवारी<br>रेडियो</div>
  <div class="masthead-sub">non-stop highway radio</div>
</div>

<main class="shelf-row">
  <section class="player-card" aria-label="Player">
    <!-- .track-row groups art+text into one row within the card's vertical
         stack — same structure on both desktop and mobile now that mobile's
         Glass Control Card handoff also uses a column layout. -->
    <div class="track-row">
      <img class="art" id="track-art" alt="" aria-hidden="true">

      <div class="track-info">
        <div class="eyebrow">Now playing</div>
        <div class="track-title" id="track-title">Press play</div>
        <div class="track-channel" id="track-channel">—</div>
      </div>
    </div>

    <div class="time-labels">
      <span id="time-elapsed">0:00</span>
      <span id="time-total">0:00</span>
    </div>

    <div class="progress-track" id="progress-track" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="controls">
      <button class="ctrl ctrl-shuffle" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="ctrl" id="prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M19 6 9 12l10 6z"/></svg>
      </button>
      <button class="ctrl ctrl-play" id="play" type="button" aria-label="Play" aria-pressed="false">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      </button>
      <button class="ctrl" id="next" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M5 6l10 6-10 6z"/></svg>
      </button>
      <button class="ctrl ctrl-repeat" id="repeat" type="button" aria-label="Repeat" data-mode="off">
        <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="repeat-badge" aria-hidden="true">1</span>
      </button>
    </div>

    <p class="blocked-help" id="blocked-help" hidden></p>
  </section>

</main>

<a class="credit" href="https://github.com/kanishksingh3012" target="_blank" rel="noopener">by @kanishk</a>

<!-- hidden audio source; playback only, never visible -->
<div id="yt-player" class="yt-hidden"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/app.js"></script>
<script src="js/recommend.js"></script>

</body>
</html>
