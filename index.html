<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indian Bus Radio</title>
<meta name="description" content="Ambient radio from the front seat of an Indian public bus.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<img class="hero" src="assets/hero.jpg" alt="Interior of an Indian public bus, looking past the driver through the windshield onto a roadside town.">

<header class="top-row">
  <div class="pill" id="clock" aria-live="off">--:--</div>

  <div class="pill" id="live-count">
    <span class="dot" id="live-dot" data-state="offline"></span>
    <span id="live-count-value">–</span>
    <span class="muted">listening</span>
  </div>

  <nav class="top-links">
    <!-- TODO: replace with the real playlist URLs once they exist -->
    <a class="pill" href="#" target="_blank" rel="noopener">Spotify</a>
    <a class="pill" href="#" target="_blank" rel="noopener">YT Music</a>
  </nav>
</header>

<main class="chrome">
  <section class="player panel" aria-label="Player">
    <div class="now-playing">
      <div class="track-title" id="track-title">Press play</div>
      <div class="track-channel" id="track-channel">—</div>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M19 6 9 12l10 6z"/></svg>
      </button>
      <button class="ctrl ctrl-play" id="play" type="button" aria-label="Play" aria-pressed="false">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      </button>
      <button class="ctrl" id="next" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M5 6l10 6-10 6z"/></svg>
      </button>
    </div>
  </section>

  <section class="recommend panel" aria-label="Recommend a song">
    <form id="recommend-form" novalidate>
      <label class="field">
        <span>Song</span>
        <input type="text" id="rec-song" name="song" maxlength="120" required autocomplete="off" placeholder="Song name">
      </label>
      <label class="field">
        <span>Artist or link</span>
        <input type="text" id="rec-artist" name="artist" maxlength="200" autocomplete="off" placeholder="Optional">
      </label>

      <!-- honeypot: off-screen rather than display:none so naive bots still fill it -->
      <div class="hp" aria-hidden="true">
        <label for="rec-website">Website</label>
        <input type="text" id="rec-website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="rec-submit">Suggest</button>
      <p class="rec-status" id="rec-status" role="status"></p>
    </form>
  </section>
</main>

<!-- hidden audio source; playback only, never visible -->
<div id="yt-player" class="yt-hidden"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/presence.js"></script>
<script type="module" src="js/recommend.js"></script>

</body>
</html>
